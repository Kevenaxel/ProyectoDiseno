<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crepcoffee Chavarría</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/header.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar-container">
      
      <!-- Marca / Logo -->
      <a href="#inicio" class="navbar-brand" aria-label="Ir al inicio de Crepcoffee Chavarría">
        <img src="img/logo.webp" alt="Logotipo Crepcoffee Chavarría" class="navbar-logo">
        <div class="brand-text">
          <span class="brand-title">Crepcoffee</span>
          <span class="brand-subtitle">CHAVARRÍA</span>
        </div>
      </a>

      <!-- Navegación central -->
      <nav class="navbar-menu" aria-label="Menú principal">
        <ul class="nav-list">
          <li class="nav-item"><a href="#menu" class="nav-link">Menú</a></li>
          <li class="nav-item"><a href="#historia" class="nav-link">Nuestra historia</a></li>
          <li class="nav-item"><a href="#horario" class="nav-link">Horario</a></li>
          <li class="nav-item"><a href="#visitanos" class="nav-link">Visítanos</a></li>
        </ul>
      </nav>

      <!-- Botón de acción -->
      <div class="navbar-action">
        <a href="#contacto" class="whatsapp-link" aria-label="Contactar por WhatsApp">
          <span class="whatsapp-icon" aria-hidden="true">WhatsApp</span>
        </a>
      </div>

    </div>
  </header>
</body>
</html>
