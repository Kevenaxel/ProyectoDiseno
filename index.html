<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crepcoffee Chavarría</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/header.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar-container">
      
      <!-- Marca / Logo -->
      <a href="#" class="navbar-brand">
        <img src="assets/icons/Logo.jpeg" alt="Logotipo Crepcoffee Chavarría" class="navbar-logo">
        <div class="brand-text">
          <span class="brand-title">Crepcoffee</span>
          <span class="brand-subtitle">CHAVARRÍA</span>
        </div>
      </a>

      <!-- Navegación central -->
      <nav class="navbar-menu" aria-label="Menú principal">
        <ul class="nav-list">
          <li class="nav-item"><a href="#menu" class="nav-link">Menú</a></li>
          <li class="nav-item"><a href="#historia" class="nav-link">Nuestra historia</a></li>
          <li class="nav-item"><a href="#horario" class="nav-link">Horario</a></li>
          <li class="nav-item"><a href="#visitanos" class="nav-link">Visítanos</a></li>
        </ul>
      </nav>

      <!-- Botón de acción -->
      <div class="navbar-action">
        <a href="#contacto" class="btn-pedir">
          <span>Mas Informacion Por WhatsApp</span>
          <svg class="icon-chat" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </a>
      </div>

    </div>
  </header>

  <script src="js/main.js"></script>
</body>
</html>
